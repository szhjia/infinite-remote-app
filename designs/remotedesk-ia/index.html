<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>遥控台 · 仿真遥控器</title>
<style>
:root{color-scheme:light;--ink:#222333;--sub:#626476;--line:#e1e2eb;--accent:#4e46cb;--tint:#eeedff;--bg:#f6f6fa;--paper:#fff;--good:#236949;--warn:#87550c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,select{font:inherit;color:inherit}button,select{border:1px solid var(--line);border-radius:7px;background:white;padding:6px 11px}button:not(:disabled),select{cursor:pointer}button:not(:disabled):hover{background:var(--tint)}button:disabled{opacity:.55}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.primary:hover{background:#3f36ae}a,.link{color:var(--accent)}.link{border:0;background:transparent}.head,.foot{background:#fff;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.head{border-bottom:1px solid var(--line)}.foot{border-top:1px solid var(--line);font-size:12px;color:var(--sub)}.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}.mark{background:var(--accent);color:white;padding:5px 8px;border-radius:7px;font:700 12px/1.5 ui-monospace,monospace}.tag,.pill{border-radius:6px;background:#efeff4;padding:2px 7px;font-size:12px;color:var(--sub);white-space:nowrap}.pill.good{color:var(--good);background:#e9f5ef}.pill.warn{color:var(--warn);background:#fff3dd}.frame{display:grid;grid-template-columns:188px minmax(0,1fr);min-height:calc(100dvh - 110px)}aside{background:#f0f0f6;border-right:1px solid var(--line);padding:20px 13px;display:flex;flex-direction:column;gap:17px}nav{display:grid;gap:5px}nav button,.profiles button{text-align:left;border-color:transparent;background:transparent}nav button[aria-current="page"],.profiles button[aria-pressed="true"]{background:var(--tint);color:#4036aa;border-color:#dedaff;font-weight:650}.aside-meta{margin-top:auto;padding:10px 8px;border-top:1px solid var(--line)}main{padding:24px clamp(16px,4vw,46px) 30px;min-width:0}.content{max-width:1100px;margin:auto}.top{margin-bottom:18px}.eyebrow{font:650 11px/1.6 ui-monospace,monospace;letter-spacing:.12em;color:var(--accent)}h1,h2,h3,p{margin:0}h1{font-size:30px;line-height:1.22;letter-spacing:-.045em;margin:3px 0 6px}h2{font-size:19px;line-height:1.35}h3{font-size:14px}p,.muted{color:var(--sub)}small{color:var(--sub);font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:13px}.card{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:16px;min-width:0}.hero{padding:18px;background:#f3f1ff;border-color:#e3ddff}.hero h2{font-size:23px;margin:1px 0 3px}.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(235px,.52fr);gap:13px;align-items:start}.scheme{grid-template-columns:minmax(155px,.36fr) minmax(0,1fr)}.profiles{display:grid;gap:4px}.profiles h3{margin-bottom:6px}.notice{border:1px solid #efdfb7;background:#fff8e9;border-radius:8px;padding:9px 11px;color:#714a0e}.list{list-style:none;padding:0;margin:0}.list li{border-top:1px solid var(--line);padding:8px 0}.list li:first-child{border-top:0}.key{display:inline-block;min-width:52px;font-weight:650}.status{display:grid;gap:8px;margin-top:9px}.status>div{display:flex;justify-content:space-between;gap:8px}.compact{font-size:12px}.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:10px 0}.keys button{padding:5px}.keys button[aria-pressed=true]{border-color:#877cf1;background:var(--tint)}.learned{color:var(--good);font-size:10px}.meta{margin-top:8px;padding:10px 0 0;border-top:1px solid var(--line)}.toast{color:var(--good);font-size:13px}.toast:empty{display:none}.dialog{position:fixed;inset:0;background:#17162955;display:grid;place-items:center;padding:18px;z-index:2}.dialog .card{width:min(100%,510px);box-shadow:0 14px 50px #1e194337}.dialog pre{overflow:auto;background:#f3f3f8;padding:10px;font-size:12px}.target{width:100%;padding:7px;font:inherit;border:1px solid var(--line);border-radius:6px}.nowrap{white-space:nowrap}@media(max-width:860px){.frame{grid-template-columns:145px minmax(0,1fr)}main{padding:19px}.scheme{grid-template-columns:145px minmax(0,1fr)}}@media(max-width:710px){.cols:not(.scheme){grid-template-columns:1fr}}@media(max-width:600px){.frame,.scheme{display:block}aside{padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}nav{grid-template-columns:repeat(3,1fr)}.aside-meta,aside>.eyebrow{display:none}main{padding:14px}.scheme>.card:first-child{margin-bottom:10px}.profiles{grid-template-columns:1fr 1fr}.profiles h3{grid-column:1/-1}.head,.foot{padding:9px 12px}}

/* The device is the window content. Its visual surface is an image; controls overlay the physical keys. */
body{background:#f4f4f6}.appbar{position:absolute;inset:18px 20px auto;z-index:1;display:flex;justify-content:flex-end;gap:8px;align-items:center;pointer-events:none}
.appbar>*{pointer-events:auto}.menubtn{width:37px;height:37px;padding:0;border-radius:50%;background:#ffffffb0;color:#343540;font-size:23px;line-height:1}
.popover{position:absolute;right:0;top:44px;width:min(250px,calc(100vw - 40px));padding:6px;border:1px solid #dedee7;border-radius:11px;background:#fff;box-shadow:0 14px 35px #1c1a3622;display:grid;gap:2px}.popover button{border:0;text-align:left;padding:7px 10px}.popover small{padding:5px 10px 2px}.popover hr{margin:4px;border:0;border-top:1px solid var(--line)}
.scene{min-height:100dvh;display:grid;place-content:center;justify-items:center;padding:55px 14px 24px;gap:14px;text-align:center}
.device{position:relative;height:clamp(330px,calc(100dvh - 166px),555px);aspect-ratio:1 / 3;touch-action:manipulation}
.device img{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none;filter:drop-shadow(0 8px 11px #272c3b21)}
.device .hotspot{position:absolute;transform:translate(-50%,-50%);padding:0;border:0;background:transparent;border-radius:50%;cursor:pointer;touch-action:manipulation}
.device .hotspot:hover{background:#ffffff21;box-shadow:inset 0 0 0 1px #ffffff70}
.device .hotspot:active,.device .hotspot.fired{background:#c1b7ff63;box-shadow:inset 0 0 0 1px #b0a2ff}
.caption h1{font-size:13px;font-weight:650;letter-spacing:0;margin:0 0 4px}.caption p{font-size:11px;display:flex;align-items:center;justify-content:center;gap:7px}.dot{width:6px;height:6px;border-radius:50%;background:#2f8b60}.dot.off{background:#8c868d}.result{min-height:1.55em;font-size:12px;color:var(--sub)}
.settings{padding:52px clamp(15px,4vw,45px) 25px;min-height:100dvh}.settings .content{max-width:850px}.settings .top{margin-top:10px}.settings .cols{margin-top:10px}.back{margin-right:auto}
@media(max-height:540px){.device{height:300px}.scene{padding-top:36px}}@media(prefers-reduced-motion:no-preference){.device .hotspot{transition:background .1s}}
</style>
</head>
<body>
<header class="appbar" id="appbar"></header>
<main id="screen" style="padding:0"></main>
<div id="overlay"></div>
<script>
const keys=[['power','电源'],['voice','语音'],['up','方向上'],['left','方向左'],['ok','确定'],['right','方向右'],['down','方向下'],['back','返回'],['plus','音量加'],['home','主页'],['minus','音量减'],['menu','菜单'],['tv','直播']];
const names={'ChatGPT':'浏览器 · ChatGPT','Codex':'Codex 桌面应用','Cursor':'Cursor 桌面应用','Claude Code · 终端':'终端'};
const presets={
 ChatGPT:{ok:'打开网页',menu:'切换到下一个 Agent'},
 Codex:{home:'新建对话 · ⌘N',ok:'发送当前草稿 · ⌘↵',back:'停止生成 · Esc',menu:'切换到下一个 Agent'},
 Cursor:{ok:'打开应用',menu:'切换到下一个 Agent'},
 'Claude Code · 终端':{ok:'打开应用',menu:'切换到下一个 Agent'}
};
const routes={home:'工作台',agents:'Agent 方案',remote:'遥控器'}, seq=Object.keys(names);
const $=id=>document.getElementById(id);
const btn=(label,act,cls='',disabled=false)=>'<button type="button" data-act="'+act+'" class="'+cls+'"'+(disabled?' disabled':'')+'>'+label+'</button>';
const pill=(label,cls='')=>'<span class="pill '+cls+'">'+label+'</span>';
const title=(n,t,d)=>'<header class="top"><div class="eyebrow">'+n+'</div><h1>'+t+'</h1><p>'+d+'</p></header>';
const state={};let dialogFocus='';
function reset(mode){Object.assign(state,{mode,page:'home',active:'Codex',view:'Codex',connected:mode==='daily',device:mode!=='setup',listen:mode!=='setup',post:mode==='daily',enabled:true,learned:new Set(mode==='setup'?[]:['home','ok','back','menu']),slot:'ok',actions:structuredClone(presets),learn:false,dialog:'',feedback:'',resume:false,logs:[]});}
reset('daily');
const keyName=id=>keys.find(x=>x[0]===id)?.[1]||'';
const requires=a=>a?.includes(' · ')||a==='发送快捷键'||a==='打开 Chat Bar';
const linked=()=>state.connected&&state.listen;
const deviceStatus=()=>!state.device?'未选设备':!state.connected?'设备离线':!state.listen?'已连接 · 未监听':'已连接 · 监听中';
function actionStatus(id,a){if(!state.enabled)return pill('已暂停');if(!state.connected)return pill('设备不可用','warn');if(!state.listen)return pill('等待输入监控','warn');if(!state.learned.has(id))return pill('未录入按键','warn');if(requires(a)&&!state.post)return pill('缺少辅助功能','warn');return pill('可遥控','good')}
let menuOpen=false, fired='', timer;
// Centers and hit extents measured on the 724 × 2172 transparent packshot.
const placement={
  power:[31.5,11.5,16.6,5.5],voice:[68.5,11.5,16.6,5.5],up:[50,19.2,34,4.9],
  left:[27.4,26.5,14.1,11.2],ok:[50,26.7,31.1,10.5],right:[72.6,26.5,14.1,11.2],down:[50,34.1,34,4.9],
  back:[34.8,41.5,23.5,7.8],plus:[65,41.5,23.5,7.8],home:[34.8,50.5,23.5,7.8],minus:[65,50.5,23.5,7.8],
  menu:[34.8,59.6,23.5,7.8],tv:[65,59.6,23.5,7.8]
};
function home(){
 const available=linked()&&state.enabled;
 const statuses=!state.device?'未选设备':!state.connected?'设备离线':!state.listen?'未监听':!state.enabled?'已暂停':'模拟已连接';
 return '<section class="scene" aria-label="仿真遥控器">'+
 (state.device?'<div class="device"><img src="assets/remote-2-pro.png" alt="" draggable="false">'+keys.map(([id,name])=>{
    const [x,y,w,h]=placement[id];
    const a=state.actions[state.active][id],hint=a?name+' · '+a:name;
    return '<button class="hotspot'+(id===fired?' fired':'')+'" data-act="press:'+id+'" aria-label="'+hint+'" title="'+hint+'" style="left:'+x+'%;top:'+y+'%;width:'+w+'%;height:'+h+'%"></button>';
 }).join('')+'</div>':'<div>'+btn('连接遥控器','route:remote','primary')+'</div>')+
 '<div class="caption"><h1>'+(state.device?'小米蓝牙遥控器 2 Pro':'未连接遥控器')+'</h1><p><span class="dot'+(!available?' off':'')+'" aria-hidden="true"></span>'+statuses+' · '+state.active+'</p></div>'+
 '<div class="result" role="status">'+state.feedback+'</div></section>';
}
function showMenu(){
 return '<div class="popover" aria-label="遥控台操作"><small>切换当前方案</small>'+seq.map(x=>btn(x+(x===state.active?' ✓':''),'activate:'+x)).join('')+'<hr>'+btn('配置 Agent 方案','inspect')+btn('配置遥控器','route:remote')+btn('按键诊断','dialog:diagnose')+btn(state.enabled?'暂停遥控触发':'恢复遥控触发','toggle')+'<hr><small>模拟连接状态</small>'+btn(state.connected?'模拟断开设备':'模拟连接设备','connection')+'</div>';
}
function agents(){
 const a=state.actions[state.view],live=state.view===state.active;
 return title('02 / ACTIONS','Agent 方案','选择一个方案浏览和配置动作。启用后，实体遥控器才会切换到它。')+
 '<div class="cols scheme"><section class="card profiles"><h3>方案列表</h3>'+seq.map(x=>'<button data-act="view:'+x+'" aria-pressed="'+(state.view===x)+'">'+x+(state.active===x?' <small>· 使用中</small>':'')+'</button>').join('')+'</section><section class="card stack"><div class="row between"><div><h2>'+state.view+'</h2><p>'+names[state.view]+'</p></div>'+(live?pill('当前启用','good'):btn('启用此方案','activate','primary'))+'</div>'+
 '<div class="meta"><div class="row between"><h3>已配置动作</h3>'+btn('配置键位','dialog:edit')+'</div><ul class="list">'+(Object.entries(a).map(([id,x])=>'<li class="row between"><span><span class="key">'+keyName(id)+'</span> '+x+'</span><div class="row">'+(!state.learned.has(id)?btn('去录入','jump:'+id,'link'):requires(x)&&!state.post?pill('缺少辅助功能','warn'):pill('已录入','good'))+btn('编辑','edit:'+id)+btn('试运行','test:'+id)+'</div></li>').join('')||'<li>未分配动作</li>')+'</ul></div>'+
 (Object.values(a).some(requires)&&!state.post?'<div class="notice row between"><span>发送快捷键需要「辅助功能」权限。</span>'+btn('模拟允许辅助功能','post')+'</div>':'')+'</section></div>';
}
function remote(){
 const recorded=state.learned.has(state.slot), label=keyName(state.slot);
 return title('03 / INPUT','遥控器','连接和录入实体按键。同一台遥控器录一次，即可供各方案使用。')+
 (state.resume?'<div class="row">'+btn('返回 '+state.view+' 方案','return','link')+'</div>':'')+
 '<div class="cols"><section class="card stack"><div class="row between"><h2>实体键录入</h2>'+pill(state.learned.size+' / 13 已录入')+'</div><div class="muted">小米 2 Pro · 实体键位</div><div class="keys">'+keys.map(([id,n])=>'<button data-act="key:'+id+'" aria-pressed="'+(state.slot===id)+'">'+n+(state.learned.has(id)?' <span class="learned" aria-label="已录入">●</span>':'')+'</button>').join('')+'</div><div class="meta stack"><div><h3>'+label+'</h3><small>'+(recorded?'已录入 · 所有方案共用':'尚未录入')+'</small></div>'+
 (state.learn?'<div class="notice">请按一下实体遥控器上的「'+label+'」。录入期间不会触发动作。</div><div class="row">'+btn('模拟收到按键','capture','primary')+btn('取消录入','cancel')+'</div>':'<div class="row">'+btn(recorded?'重新录入':'录入按键','learn','primary',!linked()||!state.enabled)+(recorded?btn('清除录入','clear'):'')+(!linked()?'<small>连接并开启监听后即可录入</small>':!state.enabled?'<small>恢复遥控触发后即可录入</small>':'')+'</div>')+
 '</div></section><div class="stack"><section class="card stack"><div class="row between"><h2>设备与连接</h2>'+pill(deviceStatus(),linked()?'good':'warn')+'</div><p>'+(state.device?'小米蓝牙语音遥控器 · HID 2717:32B8':'在 macOS 蓝牙设置配对，再选作输入设备。')+'</p><div class="row">'+(!state.connected?btn('模拟配对并选择设备','connect'):!state.listen?btn('模拟开启输入监控','listen','primary'):pill('输入监控已开启','good'))+'</div></section><section class="card stack"><h2>按键诊断</h2><p>查看收到的 HID 信号，打开诊断时实体按键不会触发动作。</p><div>'+btn('打开诊断','dialog:diagnose')+'</div></section></div></div>';
}
function modal(){
 if(!state.dialog)return '';
 const id=state.slot;
 let body='';
 if(state.dialog==='switch') body='<h2 id="dialog-title">切换当前方案</h2><p>选择后立即更改实体遥控器控制的 Agent。</p><div class="stack">'+seq.map(x=>btn(x+(x===state.active?' · 当前启用':''),'activate:'+x,'',x===state.active)).join('')+'</div>';
 if(state.dialog==='diagnose') body='<h2 id="dialog-title">按键诊断</h2><p>诊断中 · 实体按键不会触发动作</p><pre>'+(state.logs.length?state.logs.join('\n'):'还没有按键信号')+'</pre><div>'+btn('模拟收到「确定」信号','signal','primary',!linked())+'</div>';
 if(state.dialog==='edit'){
 const options=[...new Set(['未分配动作','打开网页','打开应用','发送快捷键','打开 Chat Bar','切换到下一个 Agent',...Object.values(presets[state.view])])];
 body='<h2 id="dialog-title">配置 '+state.view+' 动作</h2><label>键位 <select id="editKey">'+keys.map(([k,n])=>'<option value="'+k+'" '+(k===id?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label>动作 <select id="editAction">'+options.map(a=>'<option '+((state.actions[state.view][id]||'未分配动作')===a?'selected':'')+'>'+a+'</option>').join('')+'</select></label><div>'+btn('保存动作','save','primary')+'</div>';
 }
 return '<div class="dialog"><section class="card stack" role="dialog" aria-modal="true" aria-labelledby="dialog-title">'+body+'<div>'+btn(state.dialog==='diagnose'?'完成':'关闭','close')+'</div></section></div>';
}
function render(){
 const settings=state.page!=='home';
 $('appbar').innerHTML=(settings?btn('返回遥控器','route:home','back'):'')+'<button type="button" class="menubtn" data-act="menu" aria-label="遥控台菜单" aria-expanded="'+menuOpen+'">⋯</button>'+(menuOpen?showMenu():'');
 $('screen').innerHTML=settings?'<div class="settings"><div class="content">'+({agents,remote}[state.page])()+'<div class="toast" role="status">'+state.feedback+'</div></div></div>':home();
 $('overlay').innerHTML=modal();
 for(const el of [$('appbar'),$('screen')])el.inert=!!state.dialog;
}
function go(page){state.page=page;state.learn=false;state.resume=false}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b){if(menuOpen&&!e.target.closest('.popover')){menuOpen=false;render()}return;}
 const [op,v]=b.dataset.act.split(':'); const was=state.dialog;
 state.feedback='';
 if(op==='menu')menuOpen=!menuOpen;else menuOpen=false;
 if(op==='connection'){state.device=true;state.connected=!state.connected;state.learn=false}
 if(op==='press'){
   fired=v;clearTimeout(timer);timer=setTimeout(()=>{fired='';document.querySelector('.hotspot.fired')?.classList.remove('fired')},240);
   const action=state.actions[state.active][v];
   if(!linked())state.feedback='未发送 · 设备未监听';
   else if(!state.enabled)state.feedback='未发送 · 遥控已暂停';
   else if(!state.learned.has(v))state.feedback=keyName(v)+' · 尚未录入';
   else if(!action)state.feedback=keyName(v)+' · 未分配动作';
   else if(requires(action)&&!state.post)state.feedback='未发送 · 缺少辅助功能';
   else if(action==='切换到下一个 Agent'){state.active=seq[(seq.indexOf(state.active)+1)%seq.length];state.feedback='已切换到 '+state.active}
   else state.feedback='模拟触发 · '+action;
 }
 if(op==='route')go(v);
 if(op==='toggle'){state.enabled=!state.enabled;state.learn=false}
 if(op==='inspect'){state.view=state.active;go('agents')}
 if(op==='switch')state.dialog='switch';
 if(op==='view'){state.view=v}
 if(op==='activate'){state.active=v||state.view;state.dialog='';state.feedback='已启用 '+state.active}
 if(op==='jump'){if(state.page==='home')state.view=state.active;state.slot=v;go('remote');state.resume=true}
 if(op==='return')go('agents');
 if(op==='key'){state.slot=v;state.learn=false}
 if(op==='connect'){state.device=true;state.connected=true}
 if(op==='listen')state.listen=true;
 if(op==='post')state.post=true;
 if(op==='learn'&&linked()&&state.enabled)state.learn=true;
 if(op==='cancel')state.learn=false;
 if(op==='capture'){state.learned.add(state.slot);state.learn=false;state.feedback='已录入「'+keyName(state.slot)+'」，各方案均可使用'}
 if(op==='clear'){state.learned.delete(state.slot);state.feedback='已清除实体信号，方案动作仍保留'}
 if(op==='dialog'){state.learn=false;state.dialog=v}
 if(op==='close')state.dialog='';
 if(op==='signal'){state.logs.unshift('确定 · HID 示例信号');state.logs=state.logs.slice(0,8)}
 if(op==='edit'){state.slot=v;state.dialog='edit'}
 if(op==='test'){const a=state.actions[state.view][v];state.feedback=requires(a)&&!state.post?'试运行未执行：缺少辅助功能权限':'模拟试运行：'+a}
 if(op==='save'){const a=$('editAction').value;if(a==='未分配动作')delete state.actions[state.view][state.slot];else state.actions[state.view][state.slot]=a;state.dialog='';state.feedback='动作已保存'}
 if(!was&&state.dialog)dialogFocus=b.dataset.act;
 render();
 if(state.dialog)$('overlay').querySelector('button,select')?.focus();
 else if(was)document.querySelector('[data-act="'+CSS.escape(dialogFocus)+'"]')?.focus();
 else if(['route','jump','return','inspect'].includes(op)){const h=$('screen').querySelector('h1');h.tabIndex=-1;h.focus()}
 else document.querySelector('[data-act="'+CSS.escape(b.dataset.act)+'"]')?.focus();
});
document.addEventListener('change',e=>{if(e.target.id==='editKey'){state.slot=e.target.value;render();$('editKey').focus()}});
document.addEventListener('keydown',e=>{if(!state.dialog){if(e.key==='Escape'&&menuOpen){menuOpen=false;render();document.querySelector('[data-act=menu]').focus()}return;}if(e.key==='Escape'){$('overlay').querySelector('[data-act="close"]').click();return}if(e.key==='Tab'){const els=[...$('overlay').querySelectorAll('button:not(:disabled),select')];if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0]?.focus()}}});
render();
</script>
</body>
</html>
